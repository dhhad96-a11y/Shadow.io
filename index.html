<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADOW V2 - Key Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #07070a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .screen {
            display: none;
            width: 100%;
            max-width: 440px;
        }
        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Login Screen */
        .login-card {
            background: #111116;
            border: 1px solid #1f1f28;
            border-radius: 16px;
            padding: 35px 25px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
        }
        .logo-text {
            font-size: 32px;
            font-weight: 900;
            font-style: italic;
            color: #ff3333;
            text-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .logo-sub {
            font-size: 10px;
            color: #717182;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }
        .input-group {
            width: 100%;
            margin-bottom: 20px;
        }
        .access-input {
            width: 100%;
            background: #181820;
            border: 1px solid #2b2b38;
            border-radius: 8px;
            padding: 14px;
            color: #a0a0b0;
            font-size: 14px;
            text-align: center;
            outline: none;
            letter-spacing: 1px;
        }
        .access-input:focus {
            border-color: #ff3333;
            color: #fff;
        }
        .unlock-btn {
            width: 100%;
            background: #e62e2e;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(230, 46, 46, 0.4);
            letter-spacing: 1px;
        }
        .unlock-btn:hover {
            background: #ff3333;
        }
        .footer-link {
            margin-top: 25px;
            font-size: 12px;
            color: #555566;
            cursor: pointer;
            text-decoration: underline;
        }

        /* Dashboard Screen */
        .dashboard-card {
            background: #111118;
            border: 1px solid #1c1c28;
            border-radius: 16px;
            padding: 25px 20px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        }
        .dash-header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 12px;
            border-bottom: 1px solid #1c1c28;
        }
        .brand-header-title {
            font-size: 20px;
            font-weight: 800;
            color: #ff3333;
            letter-spacing: 1.5px;
        }
        .section-title {
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: #b0b0c2;
            margin-bottom: 20px;
        }
        .form-label {
            font-size: 11px;
            color: #717185;
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .select-box {
            width: 100%;
            background: #171721;
            border: 1px solid #252533;
            border-radius: 8px;
            padding: 12px;
            color: #e1e1f0;
            font-size: 13px;
            margin-bottom: 15px;
            outline: none;
        }
        .counter-row {
            display: flex;
            align-items: center;
            background: #171721;
            border: 1px solid #252533;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .counter-btn {
            background: #222230;
            border: none;
            color: #fff;
            padding: 12px 18px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .counter-btn:hover {
            background: #ff3333;
        }
        .counter-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            text-align: center;
            font-size: 14px;
            outline: none;
        }
        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, #cc2626, #ff3333);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 51, 51, 0.3);
            margin-bottom: 20px;
            transition: 0.2s;
        }
        .generate-btn:hover {
            opacity: 0.9;
        }
        .keys-output {
            max-height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }
        .key-item {
            background: #171721;
            border: 1px solid #222230;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: #ff4d4d;
            font-family: monospace;
            letter-spacing: 1px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #666677;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen" class="screen active">
        <div class="login-card">
            <div class="logo-text">SHADOW V2</div>
            <div class="logo-sub">ACCESS KEY</div>
            
            <div class="input-group">
                <input type="text" class="access-input" id="keyInput" placeholder="SHDW-XXXX-XXXX-XXXX" value="SHDW-9921-5582-1920">
            </div>
            
            <button class="unlock-btn" onclick="openDashboard()">UNLOCK</button>
            
            <div class="footer-link" onclick="openDashboard()">no key? contact @BX_MG</div>
        </div>
    </div>

    <!-- شاشة توليد المفاتيح (تم حذف Admin و Reseller) -->
    <div id="dashboardScreen" class="screen">
        <div class="dashboard-card">
            <div class="dash-header">
                <span class="brand-header-title">SHADOW V2</span>
            </div>

            <div class="section-title">Key Generator</div>

            <label class="form-label">📦 Product Type:</label>
            <select class="select-box" id="productType">
                <option>Shadow V2 VIP - Full Hack</option>
                <option>Drip Client - Apk Mod</option>
                <option>Pubg Mobile - Global</option>
            </select>

            <label class="form-label">⏳ Validity:</label>
            <select class="select-box" id="validity">
                <option>1 Day</option>
                <option>7 Days</option>
                <option>30 Days</option>
            </select>

            <label class="form-label">🔢 Quantity:</label>
            <div class="counter-row">
                <button class="counter-btn" onclick="adjustQty(-1)">-</button>
                <input type="text" class="counter-input" id="qtyInput" value="5">
                <button class="counter-btn" onclick="adjustQty(1)">+</button>
            </div>

            <button class="generate-btn" onclick="generateKeys()">⚡ GENERATE KEYS</button>

            <div class="form-label" style="margin-bottom: 8px;">Generated keys:</div>
            <div class="keys-output" id="keysContainer">
                <div class="key-item">SHDW-ZJBUFH-CWTAOL</div>
                <div class="key-item">SHDW-DLXKHE-9DYCL4</div>
            </div>

            <div class="back-link" onclick="backToLogin()">← Back to Login</div>
        </div>
    </div>

    <script>
        function openDashboard() {
            document.getElementById('loginScreen').classList.remove('active');
            document.getElementById('dashboardScreen').classList.add('active');
        }

        function backToLogin() {
            document.getElementById('dashboardScreen').classList.remove('active');
            document.getElementById('loginScreen').classList.add('active');
        }

        function adjustQty(amount) {
            let input = document.getElementById('qtyInput');
            let val = parseInt(input.value) + amount;
            if (val < 1) val = 1;
            if (val > 50) val = 50;
            input.value = val;
        }

        function generateKeys() {
            let qty = parseInt(document.getElementById('qtyInput').value);
            let container = document.getElementById('keysContainer');
            container.innerHTML = '';
            
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            for (let i = 0; i < qty; i++) {
                let randomKey = 'SHDW-';
                for (let j = 0; j < 12; j++) {
                    randomKey += chars.charAt(Math.floor(Math.random() * chars.length));
                    if (j === 3 || j === 7) randomKey += '-';
                }
                let div = document.createElement('div');
                div.className = 'key-item';
                div.innerText = randomKey;
                container.appendChild(div);
            }
        }
    </script>
</body>
</html>
