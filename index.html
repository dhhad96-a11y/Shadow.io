<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHADOW TEAM - Complete Management System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #060609;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .screen {
            display: none;
            width: 100%;
            max-width: 440px;
        }
        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 1. واجهة المستخدم الرئيسية */
        .portal-card {
            background: #0d0d12;
            border: 1px solid #1a1a24;
            border-radius: 20px;
            padding: 35px 25px;
            width: 100%;
            box-shadow: 0 15px 40px rgba(0,0,0,0.95);
            text-align: center;
        }
        .portal-title {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
        }
        .portal-sub {
            font-size: 10px;
            color: #ff3333;
            letter-spacing: 3px;
            margin-bottom: 30px;
            font-weight: 700;
        }
        .input-container {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }
        .key-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
        }
        .portal-input {
            width: 100%;
            background: #121218;
            border: 1px solid #222230;
            border-radius: 12px;
            padding: 16px 16px 16px 45px;
            color: #a0a0b0;
            font-size: 13px;
            outline: none;
            letter-spacing: 1px;
        }
        .portal-input:focus {
            border-color: #ff2222;
            color: #fff;
        }
        .remember-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            font-size: 12px;
            color: #888899;
            cursor: pointer;
        }
        .remember-row input[type="checkbox"] {
            accent-color: #ff2222;
            width: 15px;
            height: 15px;
            cursor: pointer;
        }
        .login-btn {
            width: 100%;
            background: #e61919;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 20px rgba(230, 25, 25, 0.4);
            letter-spacing: 1px;
            margin-bottom: 25px;
        }
        .login-btn:hover {
            background: #ff2222;
        }
        .portal-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #777788;
            padding: 0 5px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .portal-footer span {
            cursor: pointer;
            transition: 0.2s;
        }
        .portal-footer span:hover {
            color: #fff;
        }

        /* 2. نافذة تسجيل سر الأدمن / البائع */
        .admin-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .admin-modal.active {
            display: flex;
        }
        .admin-box {
            background: #0d0d12;
            border: 1px solid #222230;
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .admin-box input {
            width: 100%;
            background: #14141c;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            text-align: center;
            font-size: 14px;
            margin: 15px 0 10px;
            outline: none;
        }
        .admin-error {
            color: #ff3333;
            font-size: 11px;
            margin-bottom: 10px;
            display: none;
        }

        /* 3. لوحة التحكم للأدمن والبائعين */
        .dashboard-card {
            background: #0d0d12;
            border: 1px solid #1a1a24;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.95);
        }
        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1a1a24;
        }
        .admin-title {
            font-size: 13px;
            font-weight: 700;
            color: #ddddf0;
        }
        .balance-badge {
            background: #1a0808;
            border: 1px solid #4a1515;
            color: #ff4d4d;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
        }
        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #ff4d4d;
            margin: 15px 0 10px;
            border-right: 3px solid #ff4d4d;
            padding-right: 8px;
            text-align: right;
        }
        .form-label {
            font-size: 10px;
            color: #666677;
            margin-bottom: 4px;
            display: block;
            text-transform: uppercase;
        }
        .select-box, .text-input {
            width: 100%;
            background: #121218;
            border: 1px solid #222230;
            border-radius: 8px;
            padding: 10px;
            color: #e1e1f0;
            font-size: 12px;
            margin-bottom: 10px;
            outline: none;
        }
        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, #b31212, #e61919);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(230, 25, 25, 0.3);
            margin-bottom: 10px;
            transition: 0.2s;
        }
        .action-btn:hover {
            opacity: 0.9;
        }
        .reseller-list {
            max-height: 140px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
        }
        .list-item {
            background: #121218;
            border: 1px solid #1f1f2b;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 11px;
            color: #ff5555;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            background: #2a0808;
            border: 1px solid #551111;
            color: #ff4d4d;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
        }
        .delete-btn:hover {
            background: #ff2222;
            color: #fff;
        }

        /* مربع عرض كود واحد فقط */
        .key-single-box {
            background: #14141d;
            border: 2px dashed #ff3333;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .key-single-text {
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            color: #2ecc71;
            letter-spacing: 1px;
            word-break: break-all;
            margin-bottom: 8px;
        }
        .copy-btn {
            background: #222230;
            border: 1px solid #333344;
            color: #aaa;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
        }
        .copy-btn:hover {
            color: #fff;
            border-color: #ff3333;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 11px;
            color: #666677;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- الواجهة الرئيسية للمستخدم -->
    <div id="userScreen" class="screen active">
        <div class="portal-card">
            <div class="portal-title">👑 SHADOW TEAM</div>
            <div class="portal-sub">USER PORTAL</div>
            
            <div class="input-container">
                <span class="key-icon">🔑</span>
                <input type="text" class="portal-input" id="userKeyInput" placeholder="ENTER ACCESS KEY">
            </div>
            
            <label class="remember-row">
                <input type="checkbox"> Remember Me
            </label>
            
            <button class="login-btn" onclick="validateKeyLogin()">LOGIN [ →</button>
            
            <div class="portal-footer">
                <span onclick="alert('Contact your seller to get a key.')">◀ RESELLER</span>
                <span onclick="openAdminModal()">ADMIN 🔒</span>
            </div>
        </div>
    </div>

    <!-- نافذة دخول الأدمن والبائعين -->
    <div class="admin-modal" id="adminModal">
        <div class="admin-box">
            <div style="font-size: 15px; font-weight: bold; color: #fff;">🔒 System Portal Access</div>
            <div style="font-size: 11px; color: #777; margin-top: 4px;">Enter Admin or Reseller Password</div>
            
            <input type="password" id="adminPassInput" placeholder="Password...">
            <div class="admin-error" id="adminError">Invalid Password!</div>
            
            <div style="display: flex; gap: 10px;">
                <button onclick="closeAdminModal()" style="flex:1; background:#1c1c28; border:none; color:#aaa; padding:10px; border-radius:8px; cursor:pointer;">Cancel</button>
                <button onclick="verifyAccess()" style="flex:1; background:#e61919; border:none; color:#fff; padding:10px; border-radius:8px; cursor:pointer; font-weight:bold;">Enter</button>
            </div>
        </div>
    </div>

    <!-- لوحة تحكم الأدمن والبائعين -->
    <div id="dashboardScreen" class="screen">
        <div class="dashboard-card">
            <div class="dash-header">
                <span class="admin-title" id="panelTitle">👑 Admin Control Panel</span>
                <span class="balance-badge" id="accountBalance">UNLIMITED</span>
            </div>

            <!-- قسم إضافة وحذف البائعين (يظهر للأدمن فقط) -->
            <div id="adminResellerSection">
                <div class="section-title">👥 Manage Resellers</div>
                <label class="form-label">Reseller Name / Telegram:</label>
                <input type="text" class="text-input" id="resellerName" placeholder="@Username or Name">
                
                <label class="form-label">Initial Balance ($):</label>
                <input type="number" class="text-input" id="resellerBalance" value="10" placeholder="10">
                
                <button class="action-btn" onclick="addReseller()">➕ Add Reseller Account</button>

                <label class="form-label">Active Accounts:</label>
                <div class="reseller-list" id="resellerContainer"></div>
            </div>

            <!-- قسم توليد كود واحد فقط -->
            <div class="section-title">⚡ Generate Single Key</div>

            <label class="form-label">📦 Product Type:</label>
            <select class="select-box" id="productType">
                <option value="Shadow V2 VIP">Shadow V2 VIP - Full Hack</option>
                <option value="Drip Client">Drip Client - Apk Mod</option>
                <option value="Pubg Mobile">Pubg Mobile - Global VIP</option>
            </select>

            <label class="form-label">⏳ Validity & Price:</label>
            <select class="select-box" id="validity">
                <option value="0.50">1 Day - $0.50</option>
                <option value="3.00">7 Days - $3.00</option>
                <option value="10.00">30 Days - $10.00</option>
            </select>

            <button class="action-btn" onclick="generateSingleKey()">⚡ GENERATE 1 KEY</button>

            <!-- مربع الكود المولد الواحد -->
            <div class="key-single-box" id="singleKeyBox" style="display:none;">
                <div class="form-label">Generated Key Code:</div>
                <div class="key-single-text" id="generatedKeyText">SHDW-XXXX-XXXX-XXXX</div>
                <button class="copy-btn" onclick="copyKey()">📋 Copy Key</button>
            </div>

            <div class="back-link" onclick="lockSystem()">🔒 Lock & Back to Portal</div>
        </div>
    </div>

    <script>
        // قواعد البيانات المحلية للمفاتيح والبائعين
        let validKeys = JSON.parse(localStorage.getItem('shdw_keys')) || ["SHDW-VIP-PASS-2026"];
        let resellers = JSON.parse(localStorage.getItem('shdw_resellers')) || [
            { id: 1, name: "@BX_MG", balance: 50.00, pass: "seller123" }
        ];

        let currentUserType = "admin"; // "admin" أو رقم البائع
        let currentResellerIndex = -1;

        function renderResellers() {
            let container = document.getElementById('resellerContainer');
            container.innerHTML = '';
            resellers.forEach((r, idx) => {
                let div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <span>${r.name} (Pass: ${r.pass})</span>
                    <div>
                        <span style="color:#2ecc71; margin-right:8px;">$${r.balance.toFixed(2)}</span>
                        <button class="delete-btn" onclick="deleteReseller(${idx})">🗑️ Delete</button>
                    </div>
                `;
                container.appendChild(div);
            });
            localStorage.setItem('shdw_resellers', JSON.stringify(resellers));
        }

        function openAdminModal() {
            document.getElementById('adminModal').classList.add('active');
            document.getElementById('adminPassInput').value = '';
            document.getElementById('adminError').style.display = 'none';
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.remove('active');
        }

        function verifyAccess() {
            let val = document.getElementById('adminPassInput').value.trim();
            let err = document.getElementById('adminError');
            
            // 1. التحقق من كلمة سر الأدمن الرئيسي
            if (val === "SHADOW V2" || val === "shadow v2") {
                currentUserType = "admin";
                document.getElementById('panelTitle').innerText = "👑 Admin Control Panel";
                document.getElementById('accountBalance').innerText = "UNLIMITED";
                document.getElementById('adminResellerSection').style.display = 'block';
                closeAdminModal();
                showDashboard();
                return;
            }

            // 2. التحقق من كلمات سر البائعين
            let foundIndex = resellers.findIndex(r => r.pass === val || r.name === val);
            if (foundIndex !== -1) {
                currentUserType = "reseller";
                currentResellerIndex = foundIndex;
                let seller = resellers[foundIndex];
                document.getElementById('panelTitle').innerText = `👤 Seller: ${seller.name}`;
                document.getElementById('accountBalance').innerText = `$${seller.balance.toFixed(2)}`;
                document.getElementById('adminResellerSection').style.display = 'none';
                closeAdminModal();
                showDashboard();
                return;
            }

            err.style.display = 'block';
        }

        function showDashboard() {
            document.getElementById('userScreen').classList.remove('active');
            document.getElementById('dashboardScreen').classList.add('active');
            renderResellers();
        }

        function lockSystem() {
            document.getElementById('dashboardScreen').classList.remove('active');
            document.getElementById('userScreen').classList.add('active');
            document.getElementById('singleKeyBox').style.display = 'none';
        }

        function addReseller() {
            let name = document.getElementById('resellerName').value.trim();
            let balance = parseFloat(document.getElementById('resellerBalance').value);

            if (!name) {
                alert('Please enter reseller username');
                return;
            }

            let randomPass = "pass" + Math.floor(1000 + Math.random() * 9000);
            resellers.push({ id: Date.now(), name: name, balance: balance || 0, pass: randomPass });
            renderResellers();

            document.getElementById('resellerName').value = '';
            document.getElementById('resellerBalance').value = '10';
        }

        function deleteReseller(index) {
            if (confirm("Are you sure you want to delete this reseller?")) {
                resellers.splice(index, 1);
                renderResellers();
            }
        }

        function generateSingleKey() {
            let price = parseFloat(document.getElementById('validity').value);

            // خصم الرصيد إذا كان المستخدم بائعاً وليس أدمن
            if (currentUserType === "reseller") {
                let seller = resellers[currentResellerIndex];
                if (seller.balance < price) {
                    alert("Insufficient balance! Please contact Admin.");
                    return;
                }
                seller.balance -= price;
                document.getElementById('accountBalance').innerText = `$${seller.balance.toFixed(2)}`;
                renderResellers();
            }

            // إنشاء كود مفتاح فريد واحد
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let key = 'SHDW-';
            for (let j = 0; j < 12; j++) {
                key += chars.charAt(Math.floor(Math.random() * chars.length));
                if (j === 3 || j === 7) key += '-';
            }

            // حفظ المفتاح في النظام ليعمل في شاشة تسجيل الدخول
            validKeys.push(key);
            localStorage.setItem('shdw_keys', JSON.stringify(validKeys));

            // عرض الكود داخل المربع المصمم
            document.getElementById('generatedKeyText').innerText = key;
            document.getElementById('singleKeyBox').style.display = 'block';
        }

        function copyKey() {
            let keyText = document.getElementById('generatedKeyText').innerText;
            navigator.clipboard.writeText(keyText).then(() => {
                alert("Key copied to clipboard!");
            });
        }

        function validateKeyLogin() {
            let inputKey = document.getElementById('userKeyInput').value.trim();
            if (!inputKey) {
                alert("Please enter your Access Key!");
                return;
            }

            if (validKeys.includes(inputKey)) {
                alert("✅ SUCCESS: Access Granted! Welcome to SHADOW TEAM.");
            } else {
                alert("❌ ERROR: Invalid or expired key!");
            }
        }
    </script>
</body>
</html>
