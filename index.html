<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHADOW TEAM - VIP Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #040406;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        .screen {
            display: none;
            width: 100%;
            max-width: 440px;
        }
        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .shadow-card {
            background: #0d0d12;
            border: 1px solid rgba(255, 34, 34, 0.25);
            border-radius: 24px;
            padding: 35px 25px;
            width: 100%;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.12), inset 0 1px 1px rgba(255,255,255,0.05);
            text-align: center;
        }
        .badge-top {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 34, 34, 0.08);
            border: 1px solid rgba(255, 34, 34, 0.25);
            color: #ff4d4d;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
        }
        .shadow-title {
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            font-style: italic;
        }
        .shadow-sub {
            font-size: 10px;
            color: #ff3333;
            letter-spacing: 4px;
            margin: 6px 0 8px;
            font-weight: 800;
        }
        .neon-divider {
            width: 40px;
            height: 3px;
            background: #ff2222;
            margin: 0 auto 20px;
            border-radius: 2px;
            box-shadow: 0 0 10px #ff2222;
        }
        .hint-text {
            font-size: 10px;
            color: #777788;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .input-box-custom {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }
        .input-box-custom input {
            width: 100%;
            background: #13131a;
            border: 1px solid #222230;
            border-radius: 14px;
            padding: 16px 45px;
            color: #fff;
            font-size: 13px;
            outline: none;
            text-align: center;
            letter-spacing: 1px;
        }
        .input-box-custom input:focus {
            border-color: #ff2222;
            box-shadow: 0 0 15px rgba(255, 34, 34, 0.2);
        }
        .input-box-custom .left-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            opacity: 0.7;
        }
        .input-box-custom .right-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            cursor: pointer;
            opacity: 0.7;
        }
        .access-btn {
            width: 100%;
            background: linear-gradient(135deg, #cc1111, #ff2222);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 25px rgba(255, 34, 34, 0.4);
            letter-spacing: 1.5px;
            transition: 0.2s;
        }
        .access-btn:active {
            transform: scale(0.98);
        }
        .user-hub-card {
            background: rgba(13, 13, 18, 0.95);
            border: 1px solid rgba(255, 51, 51, 0.2);
            border-radius: 28px;
            padding: 28px 22px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 34, 34, 0.15);
            backdrop-filter: blur(14px);
        }
        .hub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .hub-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }
        .avatar-logo {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff3333, #800000);
            display: grid;
            place-items: center;
            font-size: 20px;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
        }
        .logout-pill {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 999px;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
        }
        .ring-container {
            position: relative;
            display: grid;
            place-items: center;
            margin: 10px 0 20px;
        }
        .ring-container svg {
            width: 100%;
            max-width: 220px;
        }
        circle.bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.07);
            stroke-width: 9;
        }
        circle.fg {
            fill: none;
            stroke: #ff3333;
            stroke-width: 9;
            stroke-linecap: round;
            filter: drop-shadow(0 0 8px rgba(255, 34, 34, 0.7));
        }
        .ring-center {
            position: absolute;
            text-align: center;
        }
        .ring-center small {
            color: #888899;
            font-size: 10px;
            letter-spacing: 3px;
        }
        .ring-center strong {
            display: block;
            font-size: 28px;
            color: #ff3333;
            margin: 4px 0;
            font-weight: 900;
        }
        .sub-btn {
            width: 100%;
            border: 0;
            border-radius: 18px;
            padding: 20px;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 1.5px;
            color: #ffffff;
            background: linear-gradient(135deg, #cc1111, #ff3333);
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 51, 51, 0.4);
            transition: 0.2s;
        }
        #toast {
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translate(-50%, 20px);
            background: #1a0808;
            border: 1px solid #ff3333;
            color: #fff;
            padding: 12px 24px;
            border-radius: 999px;
            font-weight: bold;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            z-index: 6000;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.4);
        }
        #toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }
    </style>
</head>
<body>
    <div id="toast">✓ Success!</div>

    <div id="userScreen" class="screen active">
        <div class="shadow-card">
            <div class="badge-top">🔒 SHADOW VIP USER PORTAL</div>
            <div class="shadow-title">SHADOW</div>
            <div class="shadow-sub">USER ACCESS HUB</div>
            <div class="neon-divider"></div>
            
            <div class="hint-text">ENTER YOUR ACCESS KEY</div>
            
            <div class="input-box-custom">
                <span class="left-icon">🔑</span>
                <input type="text" id="userKeyInput" placeholder="Enter Access Key (e.g. SHDW-XXXX)">
                <span class="right-icon" onclick="toggleInputType()">👁️</span>
            </div>
            
            <button class="access-btn" onclick="validateKeyLogin()">ACCESS VIP HUB</button>
        </div>
    </div>

    <div id="userHubScreen" class="screen">
        <div class="user-hub-card">
            <div class="hub-header">
                <div class="hub-user-info">
                    <div class="avatar-logo">🦅</div>
                    <div>
                        <b style="display:block; font-size:15px;">SHADOW VIP</b>
                        <small style="color:#666677; font-size:9px; letter-spacing:2px;">SHADOW</small>
                    </div>
                </div>
                <button class="logout-pill" onclick="lockSystem()">LOGOUT</button>
            </div>

            <div class="ring-container">
                <svg viewBox="0 0 200 200">
                    <circle class="bg" cx="100" cy="100" r="88"></circle>
                    <circle class="fg" cx="100" cy="100" r="88" transform="rotate(-90 100 100)"></circle>
                </svg>
                <div class="ring-center">
                    <small>STATUS</small>
                    <strong>ACTIVE</strong>
                    <span style="color:#888; font-size:11px;">Happ VPN Ready</span>
                </div>
            </div>

            <button class="sub-btn" onclick="openHappVpnDirectly()">＋ ADD SUBSCRIPTION</button>
        </div>
    </div>

    <script>
        const encryptedHappConfig = "Happ://crypt5/fzvdRJKmE5aHB5kakRmL3wr1151anw6dlTDzAdiZCq1MkWEm+G1zf/HZ+X4SZjXLTF9usz8DTaLG2GaJYRYe42jQxEwiBYyn14GfnZS+QWOcMF4rvd/zHPBnId5TBN6As/TWiWB2eMn2M68YMZaBwElvOR5Vm7rCngmeQbUN07LRoi6QcHsKSGmcK0g=oryOlaANwX1cUMApu3prGqf8PfGQQJOXO21vb8pPAptGcGM6FHN2tRiLFi5nGxw0khO0Zt38pMGEFK9EWDDj28Jp6Lvq/7nzhFZqeHrlP6F0BRyR51WjroWvVn/7cOV58jibKokUFZTVZaDsfHYeOijmJQzQ9Sa8hE9PkqgGL+fBVVHDCVcJgi0lMNAN4l9MkRFJaEQBNePUKEBGkdZ1HkKod2n5V2mb3JWJOPP1vo4yi4TDRRT5AtEj2gLF/AG68KIIZzr6R721E212sMwBb8puB62VMFb+43wxAj9D2oh/2Bf+earK67A/kPOJdq704fi+dCd5aoDhKuHB0wUZkJzGem+4hNuPQz30hC7iR11tlB0EEzx0AGAC/TjqpHppIsm0RCxmtcC8ABTsP9YDxlx/C39FdvP40DFkrfV2i2uAU5Mi5zM822E6KZxvL/pJfk5BFwYyZyzrczy2H/c+ZnDnXJOzRBH4Rc8CnPUwvyzFkLg2uyiITVqGhJKoOnRuGbvOvHNe9p6bTRlHmvNsj9LBh316kGt/RY+Z6t+WWZHCZF2xN9myYteNXBkpK0qy75ZXcPHKLy0MfS8UR460Z3iCRNOZqxq9YrVA81n7Lwrk7iQ7all6FiU83ssDZ7PkfiXvmkVSMsLCIk9ZKZASVb9lGgeHUZOX49UIiIhwfos=ff";

        function showToast(msg) {
            let toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function toggleInputType() {
            let input = document.getElementById('userKeyInput');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        async function validateKeyLogin() {
            let inputKey = document.getElementById('userKeyInput').value.trim();
            if (!inputKey) return alert("Please enter Access Key!");

            try {
                let response = await fetch('/api/keys/validate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({key: inputKey})
                });
                let res = await response.json();

                if (res.ok) {
                    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                    document.getElementById('userHubScreen').classList.add('active');
                } else {
                    alert(res.error || "❌ ERROR: Invalid or expired key!");
                }
            } catch (e) {
                alert("Connection error: " + e.message);
            }
        }

        function lockSystem() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('userScreen').classList.add('active');
            document.getElementById('userKeyInput').value = '';
        }

        function openHappVpnDirectly() {
            window.location.href = encryptedHappConfig;
            setTimeout(() => {
                navigator.clipboard.writeText(encryptedHappConfig).then(() => {
                    showToast("✓ Opened Happ VPN (Copied as backup)");
                });
            }, 500);
        }
    </script>
</body>
</html>
