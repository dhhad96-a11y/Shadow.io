<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHADOW TEAM - Portal & Admin</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #060609;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .screen {
            display: none;
            width: 100%;
            max-width: 440px;
        }
        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 1. واجهة المستخدم الرئيسية */
        .portal-card {
            background: #0d0d12;
            border: 1px solid #1a1a24;
            border-radius: 20px;
            padding: 35px 25px;
            width: 100%;
            box-shadow: 0 15px 40px rgba(0,0,0,0.95);
            text-align: center;
        }
        .portal-title {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
        }
        .portal-sub {
            font-size: 10px;
            color: #ff3333;
            letter-spacing: 3px;
            margin-bottom: 30px;
            font-weight: 700;
        }
        .input-container {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }
        .key-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
        }
        .portal-input {
            width: 100%;
            background: #121218;
            border: 1px solid #222230;
            border-radius: 12px;
            padding: 16px 16px 16px 45px;
            color: #a0a0b0;
            font-size: 13px;
            outline: none;
            letter-spacing: 1px;
        }
        .portal-input:focus {
            border-color: #ff2222;
            color: #fff;
        }
        .remember-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            font-size: 12px;
            color: #888899;
            cursor: pointer;
        }
        .remember-row input[type="checkbox"] {
            accent-color: #ff2222;
            width: 15px;
            height: 15px;
            cursor: pointer;
        }
        .login-btn {
            width: 100%;
            background: #e61919;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 20px rgba(230, 25, 25, 0.4);
            letter-spacing: 1px;
            margin-bottom: 25px;
        }
        .login-btn:hover {
            background: #ff2222;
        }
        .portal-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #777788;
            padding: 0 5px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .portal-footer span {
            cursor: pointer;
            transition: 0.2s;
        }
        .portal-footer span:hover {
            color: #fff;
        }

        /* 2. نافذة إدخال كلمة سر الأدمن */
        .admin-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .admin-modal.active {
            display: flex;
        }
        .admin-box {
            background: #0d0d12;
            border: 1px solid #222230;
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .admin-box input {
            width: 100%;
            background: #14141c;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            text-align: center;
            font-size: 14px;
            margin: 15px 0 10px;
            outline: none;
        }
        .admin-error {
            color: #ff3333;
            font-size: 11px;
            margin-bottom: 10px;
            display: none;
        }

        /* 3. لوحة تحكم الأدمن (مع قسم إضافة البائعين) */
        .dashboard-card {
            background: #0d0d12;
            border: 1px solid #1a1a24;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.95);
        }
        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1a1a24;
        }
        .admin-title {
            font-size: 13px;
            font-weight: 700;
            color: #ddddf0;
        }
        .balance-badge {
            background: #1a0808;
            border: 1px solid #4a1515;
            color: #ff4d4d;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
        }
        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #ff4d4d;
            margin: 15px 0 10px;
            border-right: 3px solid #ff4d4d;
            padding-right: 8px;
            text-align: right;
        }
        .form-label {
            font-size: 10px;
            color: #666677;
            margin-bottom: 4px;
            display: block;
            text-transform: uppercase;
        }
        .select-box, .text-input {
            width: 100%;
            background: #121218;
            border: 1px solid #222230;
            border-radius: 8px;
            padding: 10px;
            color: #e1e1f0;
            font-size: 12px;
            margin-bottom: 10px;
            outline: none;
        }
        .counter-row {
            display: flex;
            align-items: center;
            background: #121218;
            border: 1px solid #222230;
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
        }
        .counter-btn {
            background: #1a1a24;
            border: none;
            color: #fff;
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
        }
        .counter-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            text-align: center;
            font-size: 13px;
            outline: none;
        }
        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, #b31212, #e61919);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(230, 25, 25, 0.3);
            margin-bottom: 10px;
            transition: 0.2s;
        }
        .action-btn:hover {
            opacity: 0.9;
        }
        .reseller-list, .keys-output {
            max-height: 120px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
        }
        .list-item, .key-item {
            background: #121218;
            border: 1px solid #1f1f2b;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 11px;
            color: #ff5555;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .key-item {
            font-family: monospace;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 11px;
            color: #666677;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- الواجهة الرئيسية للمستخدم -->
    <div id="userScreen" class="screen active">
        <div class="portal-card">
            <div class="portal-title">👑 SHADOW TEAM</div>
            <div class="portal-sub">USER PORTAL</div>
            
            <div class="input-container">
                <span class="key-icon">🔑</span>
                <input type="text" class="portal-input" placeholder="ENTER ACCESS KEY">
            </div>
            
            <label class="remember-row">
                <input type="checkbox"> Remember Me
            </label>
            
            <button class="login-btn" onclick="alert('Please enter a valid access key.')">LOGIN [ →</button>
            
            <div class="portal-footer">
                <span onclick="alert('Contact your reseller to get an access key.')">◀ RESELLER</span>
                <span onclick="openAdminModal()">ADMIN 🔒</span>
            </div>
        </div>
    </div>

    <!-- نافذة كلمة سر الأدمن -->
    <div class="admin-modal" id="adminModal">
        <div class="admin-box">
            <div style="font-size: 15px; font-weight: bold; color: #fff;">🔒 Admin Authentication</div>
            <div style="font-size: 11px; color: #777; margin-top: 4px;">Enter administrator password</div>
            
            <input type="password" id="adminPassInput" placeholder="Password...">
            <div class="admin-error" id="adminError">Incorrect Password!</div>
            
            <div style="display: flex; gap: 10px;">
                <button onclick="closeAdminModal()" style="flex:1; background:#1c1c28; border:none; color:#aaa; padding:10px; border-radius:8px; cursor:pointer;">Cancel</button>
                <button onclick="verifyAdmin()" style="flex:1; background:#e61919; border:none; color:#fff; padding:10px; border-radius:8px; cursor:pointer; font-weight:bold;">Enter</button>
            </div>
        </div>
    </div>

    <!-- لوحة تحكم الأدمن الشاملة -->
    <div id="dashboardScreen" class="screen">
        <div class="dashboard-card">
            <div class="dash-header">
                <span class="admin-title">👑 Admin Control Panel</span>
                <span class="balance-badge">$500.00</span>
            </div>

            <!-- قسم إضافة البائعين الجديد -->
            <div class="section-title">👥 Add New Reseller</div>
            <label class="form-label">Reseller Username / Telegram:</label>
            <input type="text" class="text-input" id="resellerName" placeholder="@Username or Name">
            
            <label class="form-label">Initial Balance ($):</label>
            <input type="number" class="text-input" id="resellerBalance" value="10" placeholder="10">
            
            <button class="action-btn" onclick="addReseller()">➕ Add Reseller</button>

            <label class="form-label">Active Resellers:</label>
            <div class="reseller-list" id="resellerContainer">
                <div class="list-item"><span>@BX_MG (Active)</span> <span style="color:#2ecc71;">$50.00</span></div>
            </div>

            <!-- قسم توليد المفاتيح -->
            <div class="section-title">⚡ Key Generator</div>

            <label class="form-label">📦 Product Type:</label>
            <select class="select-box" id="productType">
                <option>Shadow V2 VIP - Full Hack</option>
                <option>Drip Client - Apk Mod</option>
                <option>Pubg Mobile - Global VIP</option>
            </select>

            <label class="form-label">⏳ Validity & Price:</label>
            <select class="select-box" id="validity">
                <option>1 Day - $0.50</option>
                <option>7 Days - $3.00</option>
                <option>30 Days - $10.00</option>
            </select>

            <label class="form-label">🔢 Quantity:</label>
            <div class="counter-row">
                <button class="counter-btn" onclick="adjustQty(-1)">-</button>
                <input type="text" class="counter-input" id="qtyInput" value="5">
                <button class="counter-btn" onclick="adjustQty(1)">+</button>
            </div>

            <button class="action-btn" onclick="generateKeys()">⚡ GENERATE KEYS</button>

            <label class="form-label">Generated Keys:</label>
            <div class="keys-output" id="keysContainer">
                <div class="key-item"><span>SHDW-ZJBUFH-CWTAOL</span> <span>[VIP]</span></div>
            </div>

            <div class="back-link" onclick="lockSystem()">🔒 Lock & Back to Portal</div>
        </div>
    </div>

    <script>
        function openAdminModal() {
            document.getElementById('adminModal').classList.add('active');
            document.getElementById('adminPassInput').value = '';
            document.getElementById('adminError').style.display = 'none';
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.remove('active');
        }

        function verifyAdmin() {
            let val = document.getElementById('adminPassInput').value;
            let err = document.getElementById('adminError');
            
            // كلمة المرور المفعلة والآمنة للأدمن
            if (val === "SHADOW V2" || val === "shadow v2") {
                closeAdminModal();
                document.getElementById('userScreen').classList.remove('active');
                document.getElementById('dashboardScreen').classList.add('active');
            } else {
                err.style.display = 'block';
            }
        }

        function lockSystem() {
            document.getElementById('dashboardScreen').classList.remove('active');
            document.getElementById('userScreen').classList.active = true;
            document.getElementById('userScreen').classList.add('active');
        }

        function adjustQty(amount) {
            let input = document.getElementById('qtyInput');
            let val = parseInt(input.value) + amount;
            if (val < 1) val = 1;
            if (val > 100) val = 100;
            input.value = val;
        }

        function addReseller() {
            let name = document.getElementById('resellerName').value.trim();
            let balance = document.getElementById('resellerBalance').value;
            let container = document.getElementById('resellerContainer');

            if (!name) {
                alert('Please enter a reseller name or handle.');
                return;
            }

            let div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `<span>${name} (Active)</span> <span style="color:#2ecc71;">$${balance}.00</span>`;
            container.appendChild(div);

            document.getElementById('resellerName').value = '';
            document.getElementById('resellerBalance').value = '10';
        }

        function generateKeys() {
            let qty = parseInt(document.getElementById('qtyInput').value);
            let container = document.getElementById('keysContainer');
            container.innerHTML = '';
            
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            for (let i = 0; i < qty; i++) {
                let randomKey = 'SHDW-';
                for (let j = 0; j < 12; j++) {
                    randomKey += chars.charAt(Math.floor(Math.random() * chars.length));
                    if (j === 3 || j === 7) randomKey += '-';
                }
                let div = document.createElement('div');
                div.className = 'key-item';
                div.innerHTML = `<span>${randomKey}</span> <span>[Active]</span>`;
                container.appendChild(div);
            }
        }
    </script>
</body>
</html>
