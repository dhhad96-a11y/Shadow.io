<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shadow v3.3 - Universal Config</title>

<style>
:root{--accent:#ff3333;--accent-glow:rgba(255,51,51,0.3);--bg:#050508;--panel:#0d0d14;--border:rgba(255,51,51,0.25);--text:#fff;--muted:#8888a0}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;-webkit-tap-highlight-color:transparent}
body{background-color:var(--bg);background-image:radial-gradient(circle at 50% 10%, rgba(255,51,51,0.12) 0%, transparent 60%);color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px;overflow-x:hidden}
.container{width:100%;max-width:420px;position:relative}

.card{background:rgba(13,13,20,0.95);border:1px solid var(--border);border-radius:28px;padding:25px;box-shadow:0 0 40px rgba(255,51,51,0.15);backdrop-filter:blur(20px);width:100%;text-align:center}
.brand-logo-text{font-size:24px;font-weight:900;color:var(--accent);letter-spacing:3px;margin-bottom:5px;text-shadow:0 0 15px rgba(255,51,51,0.4)}
.sub-logo-text{font-size:11px;color:var(--muted);letter-spacing:3px;margin-bottom:20px;text-transform:uppercase}

.timer-circle-box{text-align:center;padding:10px 0;position:relative}
.circle-ring{width:190px;height:190px;border:2px dashed rgba(255,51,51,0.3);border-radius:50%;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle, rgba(255,51,51,0.03) 0%, transparent 70%);box-shadow:0 0 40px rgba(255,51,51,0.08)}
.client-name-txt{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:800;margin-bottom:4px}
.main-client-txt{font-size:14px;font-weight:900;letter-spacing:2px;margin-bottom:8px}
.countdown-txt{font-size:20px;font-weight:900;letter-spacing:1px;color:#fff}
.countdown-txt span{font-size:10px;color:var(--muted);margin:0 2px}

.info-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;margin-top:15px}
.info-box{background:#040407;border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:10px 5px;text-align:center}
.info-label{font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:4px}
.info-val{font-size:11px;font-weight:bold;color:#fff}

.sub-btn{width:100%;background:linear-gradient(135deg, #ff3333, #cc0000);color:#fff;border:none;border-radius:14px;padding:16px 20px;font-weight:900;font-size:14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-top:18px;box-shadow:0 6px 20px rgba(255,51,51,0.35)}
.sub-subtxt{font-size:10px;color:rgba(255,255,255,0.7);font-weight:normal;margin-top:2px;text-align:left}
.arrow-icon{background:rgba(255,255,255,0.2);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px}

.game-tools{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;margin-top:15px}
.tool-btn{background:#040407;border:1px solid rgba(255,51,51,0.3);color:#fff;border-radius:10px;padding:10px 5px;font-size:10px;font-weight:bold;cursor:pointer;text-align:center}
.tool-btn.active{background:var(--accent);color:#fff;box-shadow:0 0 12px var(--accent-glow)}

#toast { position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 20px); background: #07070e; border: 1px solid var(--accent); color: #fff; padding: 12px 26px; border-radius: 999px; font-weight: bold; font-size: 13px; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 6000; box-shadow: 0 0 30px rgba(255,51,51,0.4); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="toast">✓ Redirecting...</div>
<div class="container">

<div class="card">
  <div class="brand-logo-text">SHADOW v3.3</div>
  <div class="sub-logo-text">UNIVERSAL CONFIG PORTAL</div>

  <div class="timer-circle-box">
    <div class="circle-ring">
      <div class="client-name-txt">STATUS</div>
      <div class="main-client-txt">ACTIVE VIP</div>
      <div id="timerDisplay" class="countdown-txt">24<span>H</span> 00<span>M</span> 00<span>S</span></div>
    </div>
  </div>

  <div class="info-grid">
    <div class="info-box"><div class="info-label">PROTOCOL</div><div class="info-val">Hysteria v2</div></div>
    <div class="info-box"><div class="info-label">STATUS</div><div class="info-val" style="color:#2ecc71;">ONLINE</div></div>
    <div class="info-box"><div class="info-label">SPEED</div><div class="info-val">UNLIMITED</div></div>
  </div>

  <div class="game-tools">
    <button class="tool-btn" id="btnAim" onclick="toggleTool('Aim')">🎯 Aim Bot</button>
    <button class="tool-btn" id="btnEsp" onclick="toggleTool('Esp')">👁️ ESP Box</button>
    <button class="tool-btn" id="btnFreeze" onclick="toggleTool('Freeze')">⚡ Fteeze</button>
  </div>

  <button class="sub-btn" onclick="launchUniversalConfig()">
    <div>
      <div>OPEN IN HAPP VPN</div>
      <div class="sub-subtxt">Direct Launch to Happ</div>
    </div>
    <div class="arrow-icon">→</div>
  </button>
</div>

</div>

<script>
// الكونفيغ المعدل باسم Shadow v3.3
let baseConfig = {
    "remarks": "Shadow v3.3",
    "inbounds": [
        {"listen": "127.0.0.1", "port": 10808, "protocol": "socks", "settings": {"auth": "noauth", "udp": true}, "sniffing": {"destOverride": ["http", "tls", "quic"], "enabled": true, "routeOnly": false}, "tag": "socks"},
        {"listen": "127.0.0.1", "port": 10809, "protocol": "http", "sniffing": {"destOverride": ["http", "tls", "quic"], "enabled": true, "routeOnly": false}, "tag": "http"}
    ],
    "outbounds": [
        {
            "protocol": "hysteria",
            "settings": {"address": "proxy-eu.dripwire.cc", "port": 443, "version": 2},
            "streamSettings": {
                "hysteriaSettings": {"auth": "2292878901", "version": 2},
                "network": "hysteria",
                "security": "tls",
                "tlsSettings": {"alpn": ["h3"], "serverName": "proxy-eu.dripwire.cc", "show": false},
                "finalmask": {"quicParams": {"disableChromeParrot": true}}
            },
            "tag": "proxy"
        },
        {"protocol": "freedom", "tag": "direct"}
    ],
    "routing": {
        "domainStrategy": "AsIs",
        "rules": [
            {"network": "tcp", "outboundTag": "proxy", "port": "39000-39999"},
            {"network": "udp", "outboundTag": "proxy", "port": "10000-10999"},
            {"network": "tcp,udp", "outboundTag": "direct"}
        ]
    }
};

function showToast(msg) {
    let t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

function toggleTool(toolName){
    let btn = document.getElementById('btn' + toolName);
    btn.classList.toggle('active');
    showToast(btn.classList.contains('active') ? '✅ ' + toolName + ' Activated!' : '❌ ' + toolName + ' Deactivated.');
}

// النقل المباشر لتطبيق Happ VPN بدون نسخ للحافظة
function launchUniversalConfig(){
    let jsonString = JSON.stringify(baseConfig);
    let happUrl = "happ://add/" + btoa(unescape(encodeURIComponent(jsonString)));
    
    showToast("✓ Launching Happ VPN...");
    window.location.href = happUrl;
}

function startTimer(){
    let sec = 86400;
    setInterval(() => {
        if(sec <= 0) return;
        sec--;
        let h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
        document.getElementById('timerDisplay').innerHTML = String(h).padStart(2,'0') + '<span>H</span> ' + String(m).padStart(2,'0') + '<span>M</span> ' + String(s).padStart(2,'0') + '<span>S</span>';
    }, 1000);
}
startTimer();
</script>
</body>
</html>
