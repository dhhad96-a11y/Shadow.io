<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHADOW TEAM - VIP Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #040406;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        .screen {
            display: none;
            width: 100%;
            max-width: 440px;
        }
        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 1. واجهة تسجيل الدخول للمستخدم */
        .portal-card {
            background: #0d0d12;
            border: 1px solid #1a1a24;
            border-radius: 20px;
            padding: 35px 25px;
            width: 100%;
            box-shadow: 0 15px 40px rgba(0,0,0,0.95);
            text-align: center;
        }
        .portal-title {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
        }
        .portal-sub {
            font-size: 10px;
            color: #ff3333;
            letter-spacing: 3px;
            margin-bottom: 30px;
            font-weight: 700;
        }
        .input-container {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }
        .key-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
        }
        .portal-input {
            width: 100%;
            background: #121218;
            border: 1px solid #222230;
            border-radius: 12px;
            padding: 16px 16px 16px 45px;
            color: #fff;
            font-size: 13px;
            outline: none;
            letter-spacing: 1px;
        }
        .portal-input:focus {
            border-color: #ff2222;
        }
        .remember-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            font-size: 12px;
            color: #888899;
            cursor: pointer;
        }
        .remember-row input[type="checkbox"] {
            accent-color: #ff2222;
        }
        .login-btn {
            width: 100%;
            background: #e61919;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 20px rgba(230, 25, 25, 0.4);
            letter-spacing: 1px;
            margin-bottom: 25px;
        }
        .login-btn:hover {
            background: #ff2222;
        }
        .portal-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #777788;
            padding: 0 5px;
            font-weight: 600;
        }
        .portal-footer span {
            cursor: pointer;
            transition: 0.2s;
        }
        .portal-footer span:hover {
            color: #fff;
        }

        /* 2. شاشة المشتركين */
        .user-hub-card {
            background: rgba(13, 13, 18, 0.95);
            border: 1px solid rgba(255, 51, 51, 0.2);
            border-radius: 28px;
            padding: 28px 22px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 34, 34, 0.15);
            backdrop-filter: blur(14px);
        }
        .hub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .hub-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }
        .avatar-logo {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff3333, #800000);
            display: grid;
            place-items: center;
            font-size: 20px;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
        }
        .logout-pill {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 999px;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
        }
        .ring-container {
            position: relative;
            display: grid;
            place-items: center;
            margin: 10px 0 20px;
        }
        .ring-container svg {
            width: 100%;
            max-width: 220px;
        }
        circle.bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.07);
            stroke-width: 9;
        }
        circle.fg {
            fill: none;
            stroke: #ff3333;
            stroke-width: 9;
            stroke-linecap: round;
            filter: drop-shadow(0 0 8px rgba(255, 51, 51, 0.7));
        }
        .ring-center {
            position: absolute;
            text-align: center;
        }
        .ring-center small {
            color: #888899;
            font-size: 10px;
            letter-spacing: 3px;
        }
        .ring-center strong {
            display: block;
            font-size: 28px;
            color: #ff3333;
            margin: 4px 0;
            font-weight: 900;
        }
        .sub-btn {
            width: 100%;
            border: 0;
            border-radius: 18px;
            padding: 20px;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 1.5px;
            color: #ffffff;
            background: linear-gradient(135deg, #cc1111, #ff3333);
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 51, 51, 0.4);
            transition: 0.2s;
        }
        .sub-btn:active {
            transform: scale(0.98);
        }

        /* 3. النوافذ واللوحات الإدارية */
        .admin-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .admin-modal.active {
            display: flex;
        }
        .admin-box {
            background: #0d0d12;
            border: 1px solid #222230;
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .admin-box input {
            width: 100%;
            background: #14141c;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            text-align: center;
            font-size: 14px;
            margin: 15px 0 10px;
            outline: none;
        }
        .dashboard-card {
            background: #0d0d12;
            border: 1px solid #1a1a24;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.95);
        }
        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1a1a24;
        }
        .admin-title {
            font-size: 13px;
            font-weight: 700;
            color: #ddddf0;
        }
        .balance-badge {
            background: #1a0808;
            border: 1px solid #4a1515;
            color: #ff4d4d;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
        }
        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #ff4d4d;
            margin: 15px 0 10px;
            border-right: 3px solid #ff4d4d;
            padding-right: 8px;
            text-align: right;
        }
        .form-label {
            font-size: 10px;
            color: #666677;
            margin-bottom: 4px;
            display: block;
            text-transform: uppercase;
        }
        .select-box, .text-input {
            width: 100%;
            background: #121218;
            border: 1px solid #222230;
            border-radius: 8px;
            padding: 10px;
            color: #e1e1f0;
            font-size: 12px;
            margin-bottom: 10px;
            outline: none;
        }
        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, #b31212, #e61919);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(230, 25, 25, 0.3);
            margin-bottom: 10px;
        }
        .reseller-list {
            max-height: 120px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
        }
        .list-item {
            background: #121218;
            border: 1px solid #1f1f2b;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 11px;
            color: #ff5555;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            background: #2a0808;
            border: 1px solid #551111;
            color: #ff4d4d;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
        }
        .key-single-box {
            background: #14141d;
            border: 2px dashed #ff3333;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin: 10px 0;
        }
        .key-single-text {
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            color: #2ecc71;
            margin-bottom: 8px;
        }
        .copy-btn {
            background: #222230;
            border: 1px solid #333344;
            color: #aaa;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 11px;
            color: #666677;
            cursor: pointer;
            text-decoration: underline;
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translate(-50%, 20px);
            background: #1a0808;
            border: 1px solid #ff3333;
            color: #fff;
            padding: 12px 24px;
            border-radius: 999px;
            font-weight: bold;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            z-index: 6000;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.4);
        }
