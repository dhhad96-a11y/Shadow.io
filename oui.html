<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADOW V2 - Control & Reseller Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #1f2833 0%, #0b0c10 100%);
            padding: 20px;
        }

        .panel-container {
            background: rgba(31, 40, 51, 0.9);
            border: 1px solid #45a29e;
            box-shadow: 0 0 25px rgba(102, 252, 241, 0.2);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 650px;
            backdrop-filter: blur(10px);
        }

        .brand-title {
            font-size: 2rem;
            font-weight: 900;
            color: #66fcf1;
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.5);
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #c5c6c7;
            text-align: center;
            margin-bottom: 25px;
            opacity: 0.8;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: #0b0c10;
            border: 1px solid #45a29e;
            color: #c5c6c7;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: #45a29e;
            color: #0b0c10;
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.4);
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #66fcf1;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #45a29e;
            background: #0b0c10;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .btn-action {
            width: 100%;
            padding: 11px;
            background: linear-gradient(135deg, #45a29e, #66fcf1);
            border: none;
            border-radius: 8px;
            color: #0b0c10;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s ease;
            margin-top: 10px;
        }

        .btn-action:hover {
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.6);
        }

        .output-box {
            background: #0b0c10;
            border: 1px dashed #45a29e;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            font-family: monospace;
            color: #66fcf1;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .badge-reseller {
            display: inline-block;
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
            border: 1px solid #ffc107;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            margin-bottom: 15px;
        }

        .footer-note {
            margin-top: 20px;
            text-align: center;
            font-size: 0.75rem;
            color: #8892b0;
        }
    </style>
</head>
<body>

    <div class="panel-container">
        <h1 class="brand-title">SHADOW V2</h1>
        <p class="subtitle">لوحة التحكم المركزية وإدارة البائعين</p>

        <!-- أزرار التبديل بين الأدمن والريسلر -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('admin')">لوحة الأدمن (Admin)</button>
            <button class="tab-btn tab-reseller" onclick="switchTab('reseller')">لوحة البائع (RESELLER)</button>
        </div>

        <!-- قسم لوحة الأدمن -->
        <div id="admin-section" class="section active">
            <h3 style="color: #66fcf1; margin-bottom: 12px; font-size: 1.1rem;">⚙️ إدارة النظام وإنشاء البائعين</h3>
            
            <div class="input-group">
                <label>اسم البائع الجديد (Reseller Username)</label>
                <input type="text" id="newResellerName" placeholder="أدخل اسم البائع مثلاً: Ahmed_Res">
            </div>

            <div class="input-group">
                <label>رصيد أو عدد الأكواد الممنوحة للبائع</label>
                <input type="number" id="resellerCredits" placeholder="مثلاً: 100">
            </div>

            <button class="btn-action" onclick="createReseller()">إنشاء حساب ريسلر جديد (RESELLER)</button>

            <div style="margin-top: 25px; border-top: 1px solid #1f2833; padding-top: 15px;">
                <h4 style="color: #66fcf1; margin-bottom: 10px; font-size: 1rem;">🔑 توليد كود أدمن رئيسي</h4>
                <button class="btn-action" onclick="generateAdminKey()">توليد كود نظام (SHADOW)</button>
                <div class="output-box" id="adminKeyOutput">SHADOW-XXXX-XXXXX</div>
            </div>
        </div>

        <!-- قسم لوحة البائع (RESELLER) -->
        <div id="reseller-section" class="section">
            <span class="badge-reseller">RESELLER PORTAL - بوابة البائع المعتمد</span>
            
            <div class="input-group">
                <label>اختر نوع الكود المطلوب</label>
                <select id="keyCodeType">
                    <option value="standard">كود قياسي (Standard Key)</option>
                    <option value="vip">كود مميز (VIP Key)</option>
                </select>
            </div>

            <button class="btn-action" onclick="generateResellerKey()">توليد كود جديد للعميل</button>
            
            <div class="output-box" id="resellerKeyOutput">SHADOW-XXXX-XXXXX</div>
        </div>

        <div class="footer-note">
            &copy; 2026 SHADOW V2 System. جميع الحقوق محفوضة.
        </div>
    </div>

    <script>
        // دالة التبديل بين الأقسام
        function switchTab(role) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            if (role === 'admin') {
                document.getElementById('admin-section').classList.add('active');
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else {
                document.getElementById('reseller-section').classList.add('active');
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
            }
        }

        // دالة توليد أجزاء عشوائية للأكواد بالشكل المطلوب SHADOW-4078-ABDUE
        function generateRandomCodePart(length) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // إنشاء كود للأدمن بالشكل المطلوب تماماً
        function generateAdminKey() {
            const part1 = Math.floor(1000 + Math.random() * 9000); // 4 أرقام مثل 4078
            const part2 = generateRandomCodePart(5); // 5 حروف مثل ABDUE
            const finalKey = `SHADOW-${part1}-${part2}`;
            document.getElementById('adminKeyOutput').innerText = finalKey;
        }

        // إنشاء كود للبائع (RESELLER) بالشكل المطلوب
        function generateResellerKey() {
            const part1 = Math.floor(1000 + Math.random() * 9000);
            const part2 = generateRandomCodePart(5);
            const finalKey = `SHADOW-${part1}-${part2}`;
            document.getElementById('resellerKeyOutput').innerText = finalKey;
        }

        // ميزة إنشاء بائع جديد من لوحة الأدمن
        function createReseller() {
            const resellerName = document.getElementById('newResellerName').value;
            const credits = document.getElementById('resellerCredits').value;

            if (!resellerName || !credits) {
                alert('الرجاء إدخال اسم البائع ورصيد الأكواد بشكل صحيح!');
                return;
            }

            alert(`تم إنشاء حساب الريسلر (RESELLER) بنجاح:\n- اسم البائع: ${resellerName}\n- الرصيد الممنوح: ${credits} كود\nيمكنه الآن تسجيل الدخول بصفته ريسلر.`);
            document.getElementById('newResellerName').value = '';
            document.getElementById('resellerCredits').value = '';
        }
    </script>

</body>
</html>
