<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHADOW - Admin & Reseller Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #020204; background-image: radial-gradient(circle at 50% 20%, rgba(0, 180, 255, 0.12) 0%, transparent 60%); color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; overflow-x: hidden; }
        .screen { display: none; width: 100%; max-width: 400px; animation: fadeIn 0.4s ease-in-out; }
        .screen.active { display: flex; flex-direction: column; align-items: center; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        .auth-container, .dashboard-card { width: 100%; background: rgba(13, 17, 26, 0.95); border: 1px solid rgba(0, 180, 255, 0.35); border-radius: 28px; padding: 35px 25px; box-shadow: 0 0 45px rgba(0, 180, 255, 0.25); backdrop-filter: blur(20px); }
        .dashboard-card { max-height: 90vh; overflow-y: auto; padding: 22px; }
        .badge-pill { display: inline-flex; align-items: center; gap: 6px; background: rgba(0, 180, 255, 0.07); border: 1px solid rgba(0, 180, 255, 0.25); border-radius: 999px; padding: 6px 16px; font-size: 10px; font-weight: 800; color: #00b4ff; letter-spacing: 2px; margin-bottom: 12px; }
        .main-title { font-size: 26px; font-weight: 900; color: #ffffff; letter-spacing: 2px; line-height: 1.1; }
        .sub-title { font-size: 14px; font-weight: 700; color: #00b4ff; letter-spacing: 3px; margin-top: 2px; }
        .divider-glow { width: 45px; height: 3px; background: #00b4ff; border-radius: 99px; margin: 14px auto; }
        .epic-quote { font-size: 10px; color: #8892b0; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; margin-bottom: 20px; }
        .input-box-wrapper { position: relative; width: 100%; margin-bottom: 20px; }
        .key-input, .select-box, .text-input { width: 100%; background: #04060a; border: 1px solid #1e1e2d; border-radius: 16px; padding: 16px; color: #fff; font-size: 13px; outline: none; text-align: center; }
        .key-input:focus, .select-box:focus, .text-input:focus { border-color: #00b4ff; background: #0d111a; }
        .unlock-btn { width: 100%; background: linear-gradient(135deg, #0099ff, #0055ff); color: #fff; border: none; border-radius: 16px; padding: 16px; font-size: 15px; font-weight: 900; cursor: pointer; letter-spacing: 2px; box-shadow: 0 8px 25px rgba(0, 120, 255, 0.45); }
        .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #1a2233; }
        .balance-badge { background: #041424; border: 1px solid #0055ff; color: #00b4ff; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .section-title { font-size: 12px; font-weight: 700; color: #00b4ff; margin: 15px 0 8px; border-left: 3px solid #00b4ff; padding-left: 8px; text-align: left; }
        .form-label { font-size: 10px; color: #8892b0; margin-bottom: 4px; display: block; text-align: left; text-transform: uppercase; }
        .reseller-list { max-height: 110px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
        .list-item { background: #04060a; border: 1px solid #1e1e2d; padding: 8px 12px; border-radius: 8px; font-size: 11px; color: #fff; display: flex; justify-content: space-between; align-items: center; }
        .delete-btn { background: #2a0808; border: 1px solid #551111; color: #ff4d4d; padding: 3px 8px; border-radius: 6px; cursor: pointer; font-size: 10px; }
        .back-link { display: block; text-align: center; margin-top: 15px; font-size: 11px; color: #8892b0; cursor: pointer; text-decoration: underline; }
        #toast { position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 20px); background: #07090e; border: 1px solid #00b4ff; color: #fff; padding: 12px 26px; border-radius: 999px; font-weight: bold; font-size: 13px; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 6000; }
        #toast.show { opacity: 1; transform: translate(-50%, 0); }
    </style>

    <!-- Firebase SDK بمشروعك الجديد -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCrLmFgqCL6veqA2wZ7Nv3OMiby8ZlV4TQ",
            authDomain: "zbyb-8142b.firebaseapp.com",
            projectId: "zbyb-8142b",
            storageBucket: "zbyb-8142b.firebasestorage.app",
            messagingSenderId: "562490910524",
            appId: "1:562490910524:web:a411900b65a8abd4b5a039"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.deleteDoc = deleteDoc;
        window.doc = doc;
        window.updateDoc = updateDoc;

        window.loadCloudData();
    </script>
</head>
<body>
    <div id="toast">✓ Success!</div>

    <div id="loginScreen" class="screen active">
        <div class="auth-container" style="text-align: center;">
            <div class="badge-pill">🔒 ADMIN & RESELLER PANEL</div>
            <div class="main-title">SHADOW</div>
            <div class="sub-title">CONTROL HUB</div>
            <div class="divider-glow"></div>
            <div class="epic-quote">ENTER ADMIN PASSWORD OR USERNAME</div>

            <div class="input-box-wrapper">
                <input type="password" class="key-input" id="userInput" placeholder="Password or Username">
            </div>
            <button class="unlock-btn" onclick="handleLogin()">ACCESS PANEL</button>
        </div>
    </div>

    <div id="dashboardScreen" class="screen">
        <div class="dashboard-card">
            <div class="dash-header">
                <span style="font-size: 13px; font-weight: 700;" id="panelTitle">👑 Control Panel</span>
                <span class="balance-badge" id="accountBalance">UNLIMITED</span>
            </div>

            <div id="adminResellerSection" style="display:none;">
                <div class="section-title">👥 Manage Resellers</div>
                <label class="form-label">Reseller Username:</label>
                <input type="text" class="text-input" id="resellerName" placeholder="Username" style="margin-bottom:8px;">
                <label class="form-label">Initial Balance ($):</label>
                <input type="number" class="text-input" id="resellerBalance" value="20" style="margin-bottom:8px;">
                <button class="unlock-btn" style="padding: 12px; font-size: 13px; margin-bottom: 12px;" onclick="addReseller()">➕ Add Reseller Account</button>
                <label class="form-label">Active Resellers:</label>
                <div class="reseller-list" id="resellerContainer"></div>
            </div>

            <div class="section-title">🛒 Buy & Generate Key</div>
            <label class="form-label">📦 Product Type:</label>
            <select class="select-box" id="productType" style="margin-bottom:8px;">
                <option value="Shadow V3">Shadow v3 - Happ VPN</option>
                <option value="Shadow Client">Shadow Client - Apk Mod</option>
            </select>
            <label class="form-label">⏳ Validity & Price:</label>
            <select class="select-box" id="validity" style="margin-bottom:12px;">
                <option value="0.50" data-days="1">1 Day - $0.50</option>
                <option value="3.00" data-days="7">7 Days - $3.00</option>
                <option value="10.00" data-days="30">30 Days - $10.00</option>
            </select>
            <button class="unlock-btn" style="padding: 14px; font-size: 14px;" onclick="buyAndGenerateKey()">🛒 BUY & GENERATE KEY</button>

            <div style="background: #04060a; border: 2px dashed #00b4ff; border-radius: 12px; padding: 15px; text-align: center; margin-top: 15px; display:none;" id="singleKeyBox">
                <div class="form-label" style="text-align: center;">Generated Key Code:</div>
                <div style="font-family: monospace; font-size: 13px; font-weight: bold; color: #2ecc71; margin-bottom: 8px;" id="generatedKeyText">SHADOW_XXX_XXX</div>
                <button class="unlock-btn" style="padding: 8px; font-size: 11px; background: #1e1e2d;" onclick="copyGeneratedKey()">📋 Copy Key</button>
            </div>

            <div class="back-link" onclick="logout()">🔒 Logout</div>
        </div>
    </div>

    <script>
        let cloudResellers = [];
        let currentUserType = "admin";
        let currentResellerId = null;
        let currentResellerData = null;

        function showToast(msg) {
            let toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        window.loadCloudData = async function() {
            try {
                const resellersSnap = await window.getDocs(window.collection(window.db, "resellers"));
                cloudResellers = resellersSnap.docs.map(d => ({ firestoreId: d.id, ...d.data() }));
            } catch (e) { console.error(e); }
        };

        function renderResellersUI() {
            let container = document.getElementById('resellerContainer');
            container.innerHTML = '';
            cloudResellers.forEach((r) => {
                let div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `<span><b>${r.name}</b></span><div><span style="color:#2ecc71; margin-right:8px;">$${Number(r.balance).toFixed(2)}</span><button class="delete-btn" onclick="deleteResellerCloud('${r.firestoreId}')">Delete</button></div>`;
                container.appendChild(div);
            });
        }

        window.handleLogin = async function() {
            let val = document.getElementById('userInput').value.trim();
            if (!val) return alert("Please enter Admin Password or Reseller Username!");
            await window.loadCloudData();

            if (val === "050707070") {
                currentUserType = "admin";
                document.getElementById('panelTitle').innerText = "👑 Admin Panel";
                document.getElementById('accountBalance').innerText = "UNLIMITED";
                document.getElementById('adminResellerSection').style.display = 'block';
                showDashboard();
            } else {
                let found = cloudResellers.find(r => r.name.toLowerCase() === val.toLowerCase());
                if (found) {
                    currentUserType = "reseller";
                    currentResellerId = found.firestoreId;
                    currentResellerData = found;
                    document.getElementById('panelTitle').innerText = `👤 Seller: ${found.name}`;
                    document.getElementById('accountBalance').innerText = `$${Number(found.balance).toFixed(2)}`;
                    document.getElementById('adminResellerSection').style.display = 'none';
                    showDashboard();
                } else {
                    alert("❌ Invalid Admin Password or Reseller Username!");
                }
            }
        };

        function showDashboard() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('dashboardScreen').classList.add('active');
            renderResellersUI();
        }

        function logout() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('loginScreen').classList.add('active');
            document.getElementById('singleKeyBox').style.display = 'none';
            document.getElementById('userInput').value = '';
        }

        window.addReseller = async function() {
            let name = document.getElementById('resellerName').value.trim();
            let balance = parseFloat(document.getElementById('resellerBalance').value);
            if (!name) return alert('Please enter username');
            try {
                const docRef = await window.addDoc(window.collection(window.db, "resellers"), { name: name, balance: balance || 0 });
                cloudResellers.push({ firestoreId: docRef.id, name: name, balance: balance || 0 });
                renderResellersUI();
                document.getElementById('resellerName').value = '';
                showToast(`✓ Reseller ${name} saved!`);
            } catch (e) { alert("Error: " + e.message); }
        };

        window.deleteResellerCloud = async function(firestoreId) {
            if (confirm("Delete this reseller?")) {
                try {
                    await window.deleteDoc(window.doc(window.db, "resellers", firestoreId));
                    cloudResellers = cloudResellers.filter(r => r.firestoreId !== firestoreId);
                    renderResellersUI();
                    showToast("✓ Deleted!");
                } catch (e) { alert("Error: " + e.message); }
            }
        };

        window.buyAndGenerateKey = async function() {
            let priceSelect = document.getElementById('validity');
            let price = parseFloat(priceSelect.value);
            let daysToAdd = parseInt(priceSelect.options[priceSelect.selectedIndex].getAttribute('data-days')) || 1;

            if (currentUserType === "reseller") {
                if (currentResellerData.balance < price) return alert("❌ Insufficient balance!");
                currentResellerData.balance -= price;
                try {
                    await window.updateDoc(window.doc(window.db, "resellers", currentResellerId), { balance: currentResellerData.balance });
                    document.getElementById('accountBalance').innerText = `$${Number(currentResellerData.balance).toFixed(2)}`;
                } catch (e) { return alert("Error: " + e.message); }
            }

            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let part1 = '', part2 = '';
            for (let i = 0; i < 3; i++) part1 += chars.charAt(Math.floor(Math.random() * chars.length));
            for (let i = 0; i < 3; i++) part2 += chars.charAt(Math.floor(Math.random() * chars.length));
            
            let key = `SHADOW_${part1}_${part2}`;
            let expiryTimestamp = new Date().getTime() + (daysToAdd * 24 * 60 * 60 * 1000);

            try {
                await window.addDoc(window.collection(window.db, "keys"), { code: key, expiresAt: expiryTimestamp, locked: false });
                document.getElementById('generatedKeyText').innerText = key;
                document.getElementById('singleKeyBox').style.display = 'block';
                showToast("✓ Key generated & saved!");
            } catch (e) { alert("Error: " + e.message); }
        };

        function copyGeneratedKey() {
            navigator.clipboard.writeText(document.getElementById('generatedKeyText').innerText).then(() => showToast("Copied!"));
        }
    </script>
</body>
</html>
